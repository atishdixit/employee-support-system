services:
  backend:
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3.2:3b}"
      CHAT_PROVIDER: "${CHAT_PROVIDER:-ollama}"
      CHAT_TEMPERATURE: "${CHAT_TEMPERATURE:-0.4}"
      CHAT_MAX_TOKENS: "${CHAT_MAX_TOKENS:-300}"
      CHAT_MIN_TOKENS: "${CHAT_MIN_TOKENS:-20}"
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-dev}"
      UI_ORIGIN: "http://localhost:${UI_PORT:-4200}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../logs:/app/logs

  frontend:
    build:
      context: ..
      dockerfile: infra/frontend.Dockerfile
    ports:
      - "${UI_PORT:-4200}:80"
    depends_on:
      - backend
