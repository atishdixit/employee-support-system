spring:
  application:
    name: employee-support-app
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_MODEL:llama3.2:3b}

server:
  port: ${API_PORT:8080}

app:
  chat:
    # provider is a label today: only the Ollama starter is on the classpath.
    # See docs/SETUP.md "Adding a new LLM provider" for how this becomes a real switch.
    provider: ${CHAT_PROVIDER:ollama}
    model: ${OLLAMA_MODEL:llama3.2:3b}
    temperature: ${CHAT_TEMPERATURE:0.4}
    max-tokens: ${CHAT_MAX_TOKENS:300}
    min-tokens: ${CHAT_MIN_TOKENS:20}
  cors:
    allowed-origin: ${UI_ORIGIN:http://localhost:4200}

logging:
  config: classpath:log4j2.xml
