<div class="message" [class.user]="message.role === 'user'" [class.assistant]="message.role === 'assistant'">
  <div class="bubble">
    <p>{{ message.text }}</p>
    @if (message.category) {
      <span class="category" [class.out-of-scope]="message.category === 'OUT_OF_SCOPE'">
        {{ message.category }}
      </span>
    }
  </div>
</div>
