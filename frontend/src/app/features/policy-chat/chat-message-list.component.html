<div class="message-list">
  @if (messages.length === 0) {
    <p class="empty-hint">
      Ask about Leave, Holidays, Maternity/Paternity, Promotion, or Office Work Hours policy.
    </p>
  }
  @for (message of messages; track $index) {
    <app-chat-message [message]="message" />
  }
  @if (waitingForAnswer) {
    <app-loading-spinner />
  }
</div>
